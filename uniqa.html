<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniQA Portal · Bath Spa University RAK</title>
<meta name="robots" content="noindex">
<!-- Instant forward to the live portal (JS below is faster; this is the fallback) -->
<meta http-equiv="refresh" content="1;url=https://script.google.com/a/macros/bathspa.ae/s/AKfycbw1icmcGLcvMkIVVU-mnQhNncRgFwFB3sGgSiYwhQOAnbErhym-8nE1vkvjXnyrF2FcJA/exec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#111827;color:#e2e8f0;font-family:'Public Sans',system-ui,sans-serif;text-align:center}
  .box{padding:44px 28px;max-width:26rem}
  .logo{width:64px;height:64px;border-radius:18px;background:#4f46e5;display:flex;align-items:center;
        justify-content:center;font-size:32px;margin:0 auto 18px}
  h1{font-family:'Fraunces',serif;font-size:1.7rem;margin:0 0 4px;color:#fff}
  .sub{font-size:.85rem;color:#94a3b8;margin:0 0 26px}
  .spin{width:34px;height:34px;border:3px solid #3730a3;border-top-color:#a5b4fc;border-radius:50%;
        margin:0 auto 22px;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .btn{display:inline-block;background:#4f46e5;color:#fff;text-decoration:none;font-weight:600;
       font-size:.9rem;padding:.7rem 1.3rem;border-radius:.7rem}
  .btn:hover{background:#4338ca}
  .hint{font-size:.72rem;color:#64748b;margin-top:18px;line-height:1.5}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🎓</div>
    <h1>UniQA Portal</h1>
    <p class="sub">Bath Spa University · RAK Campus — Quality Assurance</p>
    <div class="spin" aria-hidden="true"></div>
    <a class="btn" id="go"
       href="https://script.google.com/a/macros/bathspa.ae/s/AKfycbw1icmcGLcvMkIVVU-mnQhNncRgFwFB3sGgSiYwhQOAnbErhym-8nE1vkvjXnyrF2FcJA/exec">
       Open the portal →</a>
    <p class="hint">Sign in with your <b>@bathspa.ae</b> Google account.<br>
       If access is denied, switch Google accounts and try again.</p>
  </div>
<script>
  // Instant redirect; the button above stays as a fallback if scripts are blocked.
  location.replace(document.getElementById('go').href);
</script>
</body>
</html>
